title: RAS University
description: A free Robotics University
theme: just-the-docs

url: https://ras-university.github.io/robotic-courses/

aux_links:
  Template Repository: https://github.com/RAS-University/robotic-courses

plugins:
  - jekyll-spaceship

include:
  - _lib
  - _book.js
  - assets

nav_order: 1
search_enabled: true

# Enable or disable the side/mobile menu globally
# Nav menu can also be selectively enabled or disabled using page variables or the minimal layout
nav_enabled: true

# Custom CSS
sass:
  load_paths:
    - _sass
    - assets/css

# Add this to ensure Just the Docs includes it
just_the_docs:
  custom_css:
    - /assets/css/custom.css

# jekyll-spaceship injects polyfill.io by default (compromised domain, not needed by
# modern browsers). Override the MathJax sources to load MathJax 3 only.
jekyll-spaceship:
  mathjax-processor:
    src:
      - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
